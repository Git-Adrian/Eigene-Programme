<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zeitenerfassung – Monatsansicht</title>
<style>
:root{
  --bg:#071021;
  --card:#0f1724;
  --muted:#9fb0c1;
  --accent:#06b6d4;
  --accent-2:#7c3aed;
  --success:#10b981;
  --danger:#ef4444;
  --glass: rgba(255,255,255,0.03);
  --text:#e6eef6;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#04101a 0%, #071021 100%);
  color:var(--text);
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px;
}

.app{ width:100%; max-width:1000px; }

h1{ margin:0 0 8px 0; font-size:20px; }
.lead{ color:var(--muted); margin:0 0 18px 0; font-size:13px }

.bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px }
.nav { display:flex; align-items:center; gap:8px }
.btn{ background:linear-gradient(90deg,var(--accent-2),var(--accent)); color:#022; border:0; padding:8px 10px; border-radius:8px; cursor:pointer; font-weight:600; }
.btn-ghost{ background:transparent; border:1px solid var(--glass); color:var(--muted); padding:8px 10px; border-radius:8px; cursor:pointer; }
.btn-danger{ background:var(--danger); color:#fff; padding:6px 10px; border-radius:8px; border:0; cursor:pointer; }

.card{ background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:16px; border-radius:12px; box-shadow:0 8px 30px rgba(2,6,23,0.6); margin-bottom:12px; border:1px solid rgba(255,255,255,0.03); }

.controls{ display:grid; grid-template-columns: 240px 170px repeat(2,1fr) 1fr; gap:10px; align-items:end }
label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px }
input[type=time], input[type=date], select { width:100%; padding:8px 10px; border-radius:8px; border:0; background:#071826; color:var(--text); font-size:14px }
.small-btn{ padding:6px 8px; border-radius:8px; border:0; background:transparent; color:var(--muted); cursor:pointer; }

.time-container{ display:flex; align-items:center; gap:6px; }

table{ width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
thead th{ text-align:left; color:var(--muted); font-size:12px; padding:10px 8px; }
tbody td{ padding:10px 8px; border-top:1px solid rgba(255,255,255,0.03); vertical-align:middle; }
.actions{ text-align:right; }

.summary{ display:flex; gap:12px; align-items:center; justify-content:space-between; margin-top:14px; flex-wrap:wrap; }
.summary .box{ padding:10px 12px; background:rgba(255,255,255,0.02); border-radius:8px; border:1px solid rgba(255,255,255,0.02); }
.formatToggle{ display:flex; gap:8px; align-items:center; }

.calendar{
  display:grid;
  grid-template-columns: repeat(7,1fr);
  gap:8px;
  margin-top:12px;
}
.calendar .day{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.03);
  border-radius:8px;
  padding:6px;
  min-height:60px;
  cursor:pointer;
}
.calendar .day .date{ font-weight:700; font-size:12px; margin-bottom:4px; }
.calendar .day .entry{ font-size:12px; padding:2px 4px; margin-bottom:2px; border-radius:4px; background:rgba(6,182,212,0.2); }

.monthNav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }

@media (max-width:860px){
  .controls{ grid-template-columns: 1fr 1fr; }
  .controls > *:nth-child(4), .controls > *:nth-child(5){ grid-column: span 2; }
}

.muted{ color:var(--muted); font-size:13px }
.center{ text-align:center }
.pill{ padding:6px 8px; border-radius:999px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); font-weight:600 }
</style>
</head>
<body>
<div class="app">
<h1>Zeitenerfassung</h1>

<div class="bar">
  <div class="nav">
    <button id="prevMonth" class="btn-ghost">← Vorheriger Monat</button>
    
    <button id="nextMonth" class="btn-ghost">Nächster Monat →</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <button id="exportCsv" class="btn-ghost">Export CSV</button>
  </div>
</div>

<div class="card">
  <div class="controls">
    <div>
      <label for="entryDate">Datum</label>
      <input type="date" id="entryDate" />
    </div>
    <div>
      <label for="startTime">Kommen</label>
      <div class="time-container">
        <input type="time" id="startTime" />
        <button id="nowStart" class="small-btn">Jetzt ⏱</button>
      </div>
    </div>
    <div>
      <label for="endTime">Gehen</label>
      <div class="time-container">
        <input type="time" id="endTime" />
        <button id="nowEnd" class="small-btn">Jetzt ⏱</button>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <button id="addEntry" class="btn">➕ Hinzufügen</button>
      <button id="addClear" class="btn-ghost">➕ Felder leeren</button>
    </div>
  </div>
</div>

<div class="card">
  <h3>Monatsansicht</h3>
  <div class="monthNav">
    <button id="prevMonthBtn" class="btn-ghost">←</button>
    <div id="monthName" class="muted"></div>
    <button id="nextMonthBtn" class="btn-ghost">→</button>
  </div>
  <div id="calendar" class="calendar"></div>
</div>
</div>

<script>
const STORAGE_KEY='zeit_entries_v2';
let entries=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
let currentDate=new Date();
let editId=null;

const entryDateInput=document.getElementById('entryDate');
const startTime=document.getElementById('startTime');
const endTime=document.getElementById('endTime');
const addEntryBtn=document.getElementById('addEntry');
const addClearBtn=document.getElementById('addClear');
const nowStart=document.getElementById('nowStart');
const nowEnd=document.getElementById('nowEnd');
const exportCsv=document.getElementById('exportCsv');
const calendarDiv=document.getElementById('calendar');
const monthName=document.getElementById('monthName');
const prevMonthBtn=document.getElementById('prevMonthBtn');
const nextMonthBtn=document.getElementById('nextMonthBtn');

/*===== Utility =====*/
function uid(){return crypto.randomUUID?crypto.randomUUID():('id-'+Math.random().toString(36).slice(2));}
function fmtDateYMD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function nowHHMM(){const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function minutesBetween(start,end){const [sh,sm]=start.split(':').map(Number);const [eh,em]=end.split(':').map(Number);let diff=(eh*60+em)-(sh*60+sm);if(diff<0)diff+=24*60;return diff;}
function hhmmFromMin(m){return `${Math.floor(m/60)}h ${m%60}m`;}
function decFromMin(m){return (m/60).toFixed(2);}
function weekdayShort(dateStr){return ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(dateStr+'T00:00').getDay()];}

/*===== Events =====*/
nowStart.onclick=()=>startTime.value=nowHHMM();
nowEnd.onclick=()=>endTime.value=nowHHMM();
addEntryBtn.onclick=()=>saveEntry();
addClearBtn.onclick=clearInputs;
prevMonthBtn.onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);renderCalendar();}
nextMonthBtn.onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);renderCalendar();}
exportCsv.onclick=exportCSV;

/*===== Core =====*/
function saveEntry(){
  const dateVal=entryDateInput.value;
  const s=startTime.value;
  const f=endTime.value;
  if(!dateVal||!s||!f)return alert("Bitte alle Felder ausfüllen!");
  if(editId){const e=entries.find(x=>x.id===editId);if(e){e.date=dateVal;e.start=s;e.end=f;} editId=null; addEntryBtn.textContent="➕ Hinzufügen";}
  else entries.push({id:uid(),date:dateVal,start:s,end:f});
  localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));
  clearInputs(); renderCalendar();
}
function clearInputs(){entryDateInput.value="";startTime.value="";endTime.value="";editId=null; addEntryBtn.textContent="➕ Hinzufügen";}
function editEntry(id){const e=entries.find(x=>x.id===id); if(!e)return; editId=id; entryDateInput.value=e.date; startTime.value=e.start; endTime.value=e.end; addEntryBtn.textContent="💾 Speichern";}

/*===== Calendar Rendering =====*/
function renderCalendar(){
  const year=currentDate.getFullYear();
  const month=currentDate.getMonth();
  monthName.textContent = currentDate.toLocaleString('de-DE',{month:'long', year:'numeric'});
  calendarDiv.innerHTML='';

  const firstDay=new Date(year, month, 1);
  const lastDay=new Date(year, month+1, 0);
  const startWeekday=firstDay.getDay();
  const totalDays=lastDay.getDate();

  // Platzhalter für die erste Woche
  for(let i=0;i<startWeekday;i++){
    const emptyDiv=document.createElement('div');
    calendarDiv.appendChild(emptyDiv);
  }

  for(let d=1;d<=totalDays;d++){
    const dayDate=new Date(year, month, d);
    const dayStr=fmtDateYMD(dayDate);
    const dayDiv=document.createElement('div');
    dayDiv.className='day';
    dayDiv.innerHTML=`<div class="date">${d} ${weekdayShort(dayStr)}</div>`;
    const dayEntries=entries.filter(e=>e.date===dayStr);
    dayEntries.forEach(e=>{
      const mins=minutesBetween(e.start,e.end);
      const span=document.createElement('div');
      span.className='entry';
      span.textContent=`${e.start}-${e.end} (${hhmmFromMin(mins)})`;
      span.onclick=()=>editEntry(e.id);
      dayDiv.appendChild(span);
    });
    dayDiv.onclick=()=>{entryDateInput.value=dayStr; startTime.focus();};
    calendarDiv.appendChild(dayDiv);
  }
}

/*===== Export CSV =====*/
function exportCSV(){
  if(entries.length===0)return alert("Keine Einträge vorhanden!");
  const rows=[["Datum","Tag","Kommen","Gehen","Dauer (hh:mm)","Dauer (h.dec)"]];
  entries.forEach(e=>{
    const mins=minutesBetween(e.start,e.end);
    rows.push([e.date,weekdayShort(e.date),e.start,e.end,hhmmFromMin(mins),decFromMin(mins)]);
  });
  const csv=rows.map(r=>r.join(";")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`zeit_${fmtDateYMD(new Date())}.csv`; a.click(); URL.revokeObjectURL(url);
}

/*===== Initial Render =====*/
renderCalendar();
</script>
</body>
</html>
